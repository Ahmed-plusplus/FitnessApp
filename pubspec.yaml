name: fitness_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  cached_network_image: ^3.3.0
  go_router: ^17.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
  - assets/images/
  - assets/icons/
  fonts:
  - family: Lexend
    fonts:
    - asset: assets/fonts/Lexend.ttf