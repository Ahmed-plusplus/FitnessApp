name: fitness_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.2.1
  cached_network_image: ^3.3.0
  go_router: ^16.2.0
  flutter_secure_storage:
  flutter_bloc:
  firebase_core: ^4.14.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
